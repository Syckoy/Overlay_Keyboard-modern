<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Overlay clavier + souris rose</title>
  <style>
    :root {
      --rose: #e56b8a;
      --rose-glow: rgba(229, 107, 138, 0.4);
      --key: rgba(18, 18, 22, 0.88);
      --key-hi: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.94);
      --stroke: rgba(255, 255, 255, 0.28);
      --gap: 3px;
      --u: 50px;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Bahnschrift, "Segoe UI", sans-serif;
      color: var(--text);
      user-select: none;
    }

    body.tiktok { background: #00ff00; }

    .stage {
      display: flex;
      align-items: stretch;
      gap: 12px;
      padding: 10px;
      width: max-content;
    }

    .kb {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .kb-box {
      position: relative;
    }

    .row {
      display: flex;
      gap: var(--gap);
      height: var(--u);
    }

    .key, .mbtn {
      height: var(--u);
      width: var(--u);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--key);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      text-transform: uppercase;
      overflow: hidden;
      transition: background 60ms linear, color 60ms linear;
    }

    .key.tab { width: calc(var(--u) * 1.45); }
    .key.caps { width: calc(var(--u) * 1.75); font-size: 11px; letter-spacing: 0.08em; }
    .key.shift { width: calc(var(--u) * 2.2); font-size: 11px; letter-spacing: 0.08em; }
    .key.mod { width: calc(var(--u) * 1.4); font-size: 11px; letter-spacing: 0.08em; }
    .key.space { width: calc(var(--u) * 5.15); font-size: 12px; letter-spacing: 0.2em; }

    .key.on, .mbtn.on {
      background: var(--rose);
      color: #fff;
      border-color: var(--stroke);
    }

    .key svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mouse {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      width: calc(var(--u) * 4 + var(--gap) * 3);
      overflow: visible;
    }

    .clicks {
      display: flex;
      gap: var(--gap);
      height: var(--u);
      overflow: visible;
    }

    .mbtn {
      flex: 1 1 0;
      width: auto;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      position: relative;
    }

    .cps {
      display: none;
    }

    .wheel {
      flex: 1 1 0;
      height: var(--u);
      border-radius: var(--radius);
      overflow: visible;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--key);
      z-index: 3;
      border: 1px solid var(--stroke);
    }

    .wheel-up, .wheel-down {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.35);
      transition: background 60ms linear, color 60ms linear;
      position: relative;
      overflow: visible;
      border-radius: 0;
    }

    .wheel-up { border-radius: var(--radius) var(--radius) 0 0; border-bottom: 1px solid var(--stroke); }
    .wheel-down { border-radius: 0 0 var(--radius) var(--radius); }

    .wheel-up.on, .wheel-down.on {
      background: var(--rose);
      color: #fff;
    }

    .sf-score {
      position: absolute;
      left: 50%;
      font-family: Impact, "Arial Black", Bahnschrift, sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 28px;
      line-height: 0.85;
      letter-spacing: 0.02em;
      color: #fff7e6;
      -webkit-text-stroke: 2px #1a0a12;
      paint-order: stroke fill;
      transform: translateX(-50%) skewX(-18deg) rotate(-8deg) scale(0.85);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }

    .sf-score.show {
      opacity: 1;
      transform: translateX(-50%) skewX(-18deg) rotate(-8deg) scale(1);
    }

    .wheel-down .sf-score.show {
      transform: translateX(-50%) skewX(-18deg) rotate(8deg) scale(1);
    }

    .sf-score.pop {
      animation: sf-pop 160ms ease-out;
    }

    .wheel-up .sf-score {
      top: -10px;
    }

    .wheel-down .sf-score {
      bottom: -10px;
      transform: translateX(-50%) skewX(-18deg) rotate(8deg) scale(0.85);
    }

    .wheel-down .sf-score.pop {
      animation: sf-pop-down 160ms ease-out;
    }

    @keyframes sf-pop {
      0% { transform: translateX(-50%) skewX(-18deg) rotate(-8deg) scale(1.35); }
      100% { transform: translateX(-50%) skewX(-18deg) rotate(-8deg) scale(1); }
    }

    @keyframes sf-pop-down {
      0% { transform: translateX(-50%) skewX(-18deg) rotate(8deg) scale(1.35); }
      100% { transform: translateX(-50%) skewX(-18deg) rotate(8deg) scale(1); }
    }

    .pad {
      position: relative;
      flex: 1 1 auto;
      background: var(--key);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: none;
      border: 1px solid var(--stroke);
    }

    #trail { display: block; width: 100%; height: 100%; }

    .status {
      position: fixed;
      right: 8px;
      bottom: 8px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 700;
    }

    .status.ok { display: none; }

    .sg-banner {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      z-index: 8;
      pointer-events: none;
      white-space: nowrap;
      font-family: Impact, "Arial Black", Bahnschrift, sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #c98989;
      -webkit-text-stroke: 1.5px #fff;
      paint-order: stroke fill;
      transform: translate(-50%, -50%) skewX(-6deg);
    }

    .sg-banner.show {
      opacity: 1;
    }

    .sg-banner.pop {
      animation: sg-pop 220ms ease-out;
    }

    @keyframes sg-pop {
      0% { transform: translate(-50%, -50%) skewX(-6deg) scale(1.28); }
      100% { transform: translate(-50%, -50%) skewX(-6deg) scale(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="kb-box">
      <div class="kb" id="kb"></div>
      <div class="sg-banner" id="sgBanner">SUPERGLIDE</div>
    </div>
    <div class="mouse">
      <div class="clicks">
        <div class="mbtn" id="m1">M1</div>
        <div class="wheel" id="wheel">
          <div class="wheel-up" id="wup">▲<span class="sf-score" id="cpsUp">0x</span></div>
          <div class="wheel-down" id="wdn">▼<span class="sf-score" id="cpsDown">0x</span></div>
        </div>
        <div class="mbtn" id="m2">M2</div>
      </div>
      <div class="pad">
        <canvas id="trail"></canvas>
      </div>
    </div>
  </div>
  <div class="status" id="status">LANCE start-overlay.bat</div>

  <script>
    if (/tiktok=1/.test(location.search)) document.body.classList.add("tiktok");
    const CONFIG = {
      wsUrl: (location.protocol === "http:" || location.protocol === "https:")
        ? ((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws")
        : "ws://127.0.0.1:7689/ws",
      // Tapis 45 x 39 cm : un grand geste = tout le pad overlay
      padWidthCm: 45,
      padHeightCm: 39,
      mouseDpi: 800,
      // cm de souris du centre jusqu'au bord du pad overlay (plus petit = plus sensible)
      travelCm: 2.1,
      mouseDecay: 0.991,
      trailLength: 42,
      minTrailDist: 1.15,
      cpsWindowMs: 1000,
      sgFps: 138,
    };

    /* Scan codes physiques = positions AZERTY */
    const VC = {
      n1: 0x0002, n2: 0x0003, n3: 0x0004, n4: 0x0005, n5: 0x0006,
      tab: 0x000f, caps: 0x003a,
      kA: 0x0010, kZ: 0x0011, kE: 0x0012, kR: 0x0013,
      kQ: 0x001e, kS: 0x001f, kD: 0x0020, kF: 0x0021,
      kW: 0x002c, kX: 0x002d, kC: 0x002e, kV: 0x002f, kB: 0x0030, kN: 0x0031,
      shiftL: 0x002a, shiftR: 0x0036,
      ctrlL: 0x001d, ctrlR: 0x0e1d,
      altL: 0x0038, altR: 0x0e38,
      space: 0x0039,
    };

    const TAB_ICON = `<svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6"/></svg>`;

    const rows = [
      [
        { id: "n1", label: "1", codes: [VC.n1] },
        { id: "n2", label: "2", codes: [VC.n2] },
        { id: "n3", label: "3", codes: [VC.n3] },
        { id: "n4", label: "4", codes: [VC.n4] },
        { id: "n5", label: "5", codes: [VC.n5] },
      ],
      [
        { id: "tab", label: TAB_ICON, codes: [VC.tab], cls: "tab" },
        { id: "kA", label: "A", codes: [VC.kA] },
        { id: "kZ", label: "Z", codes: [VC.kZ] },
        { id: "kE", label: "E", codes: [VC.kE] },
        { id: "kR", label: "R", codes: [VC.kR] },
      ],
      [
        { id: "caps", label: "CAPS", codes: [VC.caps], cls: "caps" },
        { id: "kQ", label: "Q", codes: [VC.kQ] },
        { id: "kS", label: "S", codes: [VC.kS] },
        { id: "kD", label: "D", codes: [VC.kD] },
        { id: "kF", label: "F", codes: [VC.kF] },
      ],
      [
        { id: "shift", label: "SHIFT", codes: [VC.shiftL, VC.shiftR], cls: "shift" },
        { id: "kW", label: "W", codes: [VC.kW] },
        { id: "kX", label: "X", codes: [VC.kX] },
        { id: "kC", label: "C", codes: [VC.kC] },
        { id: "kV", label: "V", codes: [VC.kV] },
        { id: "kB", label: "B", codes: [VC.kB] },
        { id: "kN", label: "N", codes: [VC.kN] },
      ],
      [
        { id: "ctrl", label: "CTRL", codes: [VC.ctrlL, VC.ctrlR], cls: "mod" },
        { id: "alt", label: "ALT", codes: [VC.altL, VC.altR], cls: "mod" },
        { id: "space", label: "SPACE", codes: [VC.space], cls: "space" },
      ],
    ];

    const kb = document.getElementById("kb");
    const elById = {};
    const codeToIds = new Map();
    const keyList = [];

    for (const row of rows) {
      const rowEl = document.createElement("div");
      rowEl.className = "row";
      for (const k of row) {
        const el = document.createElement("div");
        el.className = "key" + (k.cls ? " " + k.cls : "");
        el.innerHTML = k.label;
        rowEl.appendChild(el);
        elById[k.id] = el;
        keyList.push(k);
        for (const c of k.codes) {
          if (!codeToIds.has(c)) codeToIds.set(c, []);
          codeToIds.get(c).push(k.id);
        }
      }
      kb.appendChild(rowEl);
    }

    const pressed = new Set();

    function applyKeycode(code, down) {
      const ids = codeToIds.get(code);
      if (!ids) return;
      const key = "k:" + code;
      if (down) pressed.add(key);
      else pressed.delete(key);
      for (const id of ids) {
        const def = keyList.find((k) => k.id === id);
        const wasOn = elById[id].classList.contains("on");
        const any = def.codes.some((c) => pressed.has("k:" + c));
        elById[id].classList.toggle("on", any);
        if (down && !wasOn && any) onSgPress(id);
      }
    }

    const sgBanner = document.getElementById("sgBanner");
    let sgJumpAt = 0;
    let sgHideTimer = 0;

    function placeSgBanner() {
      const c = elById.kC.getBoundingClientRect();
      const s = elById.space.getBoundingClientRect();
      const box = document.querySelector(".kb-box").getBoundingClientRect();
      const x = (c.left + c.width / 2 + s.left + s.width / 2) / 2 - box.left;
      const y = (c.top + c.height / 2 + s.top + s.height / 2) / 2 - box.top;
      sgBanner.style.left = x + "px";
      sgBanner.style.top = y + "px";
    }

    function onSgPress(id) {
      const now = performance.now();
      if (id === "space") {
        sgJumpAt = now;
        return;
      }
      if (id !== "kC" || !sgJumpAt) return;
      const dt = now - sgJumpAt;
      sgJumpAt = 0;
      const frame = 1000 / CONFIG.sgFps;
      if (dt < frame * 0.5 || dt > frame * 1.4) return;
      placeSgBanner();
      sgBanner.classList.remove("show", "pop");
      void sgBanner.offsetWidth;
      sgBanner.classList.add("show", "pop");
      clearTimeout(sgHideTimer);
      sgHideTimer = setTimeout(() => sgBanner.classList.remove("show", "pop"), 900);
    }

    const m1 = document.getElementById("m1");
    const m2 = document.getElementById("m2");
    const wup = document.getElementById("wup");
    const wdn = document.getElementById("wdn");
    const cpsUp = document.getElementById("cpsUp");
    const cpsDown = document.getElementById("cpsDown");
    const wheels = [];
    let mouseMask = 0;
    let wheelTimer = 0;
    let wheelCountTimer = 0;
    let lastWheelUp = null;

    function setMouseButtons(mask) {
      mouseMask = mask;
      m1.classList.toggle("on", !!(mask & (1 << 8)));
      m2.classList.toggle("on", !!(mask & (1 << 9)));
    }

    function noteWheel(up) {
      const now = performance.now();
      if (lastWheelUp !== null && lastWheelUp !== up) wheels.length = 0;
      lastWheelUp = up;
      wheels.push(now);
      while (wheels.length && now - wheels[0] > CONFIG.cpsWindowMs) wheels.shift();
      const n = wheels.length;
      const el = up ? cpsUp : cpsDown;
      const other = up ? cpsDown : cpsUp;
      other.classList.remove("show", "pop");
      el.textContent = n + "x";
      el.classList.add("show");
      el.classList.remove("pop");
      void el.offsetWidth;
      el.classList.add("pop");
      clearTimeout(wheelCountTimer);
      wheelCountTimer = setTimeout(() => {
        wheels.length = 0;
        lastWheelUp = null;
        cpsUp.classList.remove("show", "pop");
        cpsDown.classList.remove("show", "pop");
      }, CONFIG.cpsWindowMs);

      wup.classList.toggle("on", up);
      wdn.classList.toggle("on", !up);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => {
        wup.classList.remove("on");
        wdn.classList.remove("on");
      }, 140);
    }

    const canvas = document.getElementById("trail");
    const ctx = canvas.getContext("2d");
    let mx = 0;
    let my = 0;
    let lastAbs = null;
    const trail = [];

    function resizeCanvas() {
      const r = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
    }

    function padLimits() {
      const r = canvas.getBoundingClientRect();
      const margin = 5;
      return {
        w: r.width,
        h: r.height,
        maxX: Math.max(8, r.width / 2 - margin),
        maxY: Math.max(8, r.height / 2 - margin),
      };
    }

    function wrapAxis(v, max) {
      const span = max * 2;
      if (span <= 0) return 0;
      let n = (v + max) % span;
      if (n < 0) n += span;
      return n - max;
    }

    function addMouseDelta(dx, dy) {
      const { maxX, maxY } = padLimits();
      const edgeX = (CONFIG.travelCm / 2.54) * CONFIG.mouseDpi;
      const edgeY = edgeX * (CONFIG.padHeightCm / CONFIG.padWidthCm);
      const sx = maxX / Math.max(1, edgeX);
      const sy = maxY / Math.max(1, edgeY);
      mx = wrapAxis(mx + dx * sx, maxX);
      my = wrapAxis(my + dy * sy, maxY);
    }

    function onMouseMoveEvent(data) {
      if (typeof data.delta_x === "number" || typeof data.dx === "number") {
        addMouseDelta(data.delta_x ?? data.dx ?? 0, data.delta_y ?? data.dy ?? 0);
        return;
      }
      if (typeof data.x === "number" && typeof data.y === "number") {
        if (lastAbs) addMouseDelta(data.x - lastAbs.x, data.y - lastAbs.y);
        lastAbs = { x: data.x, y: data.y };
      }
    }

    function drawRibbon(pts, rgb) {
      if (pts.length < 2) return;
      const left = [];
      const right = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const prev = pts[Math.max(0, i - 1)];
        const next = pts[Math.min(pts.length - 1, i + 1)];
        let dx = next.x - prev.x;
        let dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len;
        dy /= len;
        const t = i / (pts.length - 1);
        const w = 0.35 + t * t * 4.8;
        left.push({ x: p.x - dy * w, y: p.y + dx * w });
        right.push({ x: p.x + dy * w, y: p.y - dx * w });
      }
      ctx.beginPath();
      ctx.moveTo(left[0].x, left[0].y);
      for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
      for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
      ctx.closePath();
      const head = pts[pts.length - 1];
      const tail = pts[0];
      const grad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      grad.addColorStop(0, "rgba(" + rgb + ",0)");
      grad.addColorStop(0.45, "rgba(" + rgb + ",0.18)");
      grad.addColorStop(1, "rgba(" + rgb + ",0.95)");
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function draw() {
      const { w, h, maxX, maxY } = padLimits();
      const cx = w / 2;
      const cy = h / 2;

      mx *= CONFIG.mouseDecay;
      my *= CONFIG.mouseDecay;
      mx = wrapAxis(mx, maxX);
      my = wrapAxis(my, maxY);
      if (Math.abs(mx) < 0.12) mx = 0;
      if (Math.abs(my) < 0.12) my = 0;

      const px = cx + mx;
      const py = cy + my;
      const last = trail[trail.length - 1];
      const dist = last ? Math.hypot(px - last.x, py - last.y) : 999;
      if (last && dist > Math.min(w, h) * 0.4) trail.length = 0;
      if (!last || dist >= CONFIG.minTrailDist) {
        trail.push({ x: px, y: py });
        while (trail.length > CONFIG.trailLength) trail.shift();
      } else if (trail.length > 2 && dist < 0.25) {
        trail.shift();
      }

      ctx.clearRect(0, 0, w, h);
      const lmb = m1.classList.contains("on");
      const rgb = lmb ? "255,255,255" : "229,107,138";
      drawRibbon(trail, rgb);

      ctx.beginPath();
      ctx.fillStyle = lmb ? "#fff" : "#e56b8a";
      ctx.arc(px, py, 3.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.stroke();

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    function onEvent(data) {
      if (!data || !data.event_type) return;
      const t = data.event_type;
      if (t === "key_typed" || t === "hello") return;
      if (t === "key_pressed" || t === "key_released") {
        applyKeycode(data.keycode, t === "key_pressed");
        return;
      }
      if (t === "mouse_moved" || t === "mouse_dragged") {
        onMouseMoveEvent(data);
        return;
      }
      if (t === "mouse_wheel") {
        const rot = data.rotation ?? data.delta ?? 0;
        noteWheel(rot > 0);
        return;
      }

      if (t === "mouse_pressed" || t === "mouse_released") {
        if (typeof data.mask === "number") {
          setMouseButtons(data.mask);
        } else if (typeof data.button === "number") {
          const down = t === "mouse_pressed";
          if (data.button === 1) m1.classList.toggle("on", down);
          if (data.button === 2) m2.classList.toggle("on", down);
        }
      }
    }

    const status = document.getElementById("status");
    let wsOk = false;

    function startWs() {
      let ws;
      try { ws = new WebSocket(CONFIG.wsUrl); }
      catch (e) {
        status.textContent = "LANCE start-overlay.bat";
        setTimeout(startWs, 2000);
        return;
      }
      ws.onopen = () => {
        wsOk = true;
        status.textContent = "";
        status.classList.add("ok");
      };
      ws.onmessage = (e) => {
        try { onEvent(JSON.parse(e.data)); } catch (_) {}
      };
      ws.onerror = () => {};
      ws.onclose = () => {
        wsOk = false;
        status.classList.remove("ok");
        status.textContent = "LANCE start-overlay.bat";
        setTimeout(startWs, 2000);
      };
    }
    startWs();

    const demoKey = {
      Digit1: VC.n1, Digit2: VC.n2, Digit3: VC.n3, Digit4: VC.n4, Digit5: VC.n5,
      Tab: VC.tab, CapsLock: VC.caps,
      KeyQ: VC.kA, KeyW: VC.kZ, KeyE: VC.kE, KeyR: VC.kR,
      KeyA: VC.kQ, KeyS: VC.kS, KeyD: VC.kD, KeyF: VC.kF,
      KeyZ: VC.kW, KeyX: VC.kX, KeyC: VC.kC, KeyV: VC.kV, KeyB: VC.kB, KeyN: VC.kN,
      ShiftLeft: VC.shiftL, ShiftRight: VC.shiftR,
      ControlLeft: VC.ctrlL, ControlRight: VC.ctrlR,
      AltLeft: VC.altL, AltRight: VC.altR, Space: VC.space,
    };

    window.addEventListener("keydown", (e) => {
      if (wsOk) return;
      if (demoKey[e.code] != null) {
        e.preventDefault();
        applyKeycode(demoKey[e.code], true);
      }
    });
    window.addEventListener("keyup", (e) => {
      if (wsOk) return;
      if (demoKey[e.code] != null) applyKeycode(demoKey[e.code], false);
    });
    window.addEventListener("mousemove", (e) => {
      if (wsOk) return;
      addMouseDelta(e.movementX, e.movementY);
    });
    window.addEventListener("mousedown", (e) => {
      if (wsOk) return;
      if (e.button === 0) m1.classList.add("on");
      if (e.button === 2) m2.classList.add("on");
    });
    window.addEventListener("mouseup", (e) => {
      if (wsOk) return;
      if (e.button === 0) m1.classList.remove("on");
      if (e.button === 2) m2.classList.remove("on");
    });
    window.addEventListener("wheel", (e) => {
      if (wsOk) return;
      noteWheel(e.deltaY < 0);
    }, { passive: true });
    window.addEventListener("contextmenu", (e) => e.preventDefault());
  </script>
</body>
</html>
